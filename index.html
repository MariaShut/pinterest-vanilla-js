<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pinterest</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./src/styles/main.scss" />
	</head>
	<body>
		<header class="header">
			<div class="container header__container">
				<a href="#" class="header__logo-link">
					<picture>
						<source media="(max-width: 576px)" srcset="./src/img/logo-mobile.svg" />
						<img src="./src/img/logo.svg" alt="logo" class="header__logo" />
					</picture>
				</a>

				<div class="header__search">
					<span class="header__search-icon">
						<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path
								d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
								fill="#5D605F" />
						</svg>
					</span>
					<input type="text" placeholder="Search the archive..." class="header__search-input" />
				</div>

				<div class="header__select">
					<button class="header__select-btn">
						Boards
						<svg class="header__arrow" width="7" height="5" viewBox="0 0 7 5" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M3.5 4.31667L0 0.816667L0.816667 0L3.5 2.68333L6.18333 0L7 0.816667L3.5 4.31667Z" fill="#303333" />
						</svg>
					</button>

					<div class="dropdown">
						<div class="dropdown__title">Select a board</div>
						<ul class="dropdown__list list-reset">
							<li class="dropdown__item" data-id="journaling">
								<img src="./src/img/board-icons/journaling-icon.jpeg" class="dropdown__icon" />
								Journaling
							</li>
							<li class="dropdown__item" data-id="art">
								<img src="./src/img/board-icons/art-icon.jpeg" class="dropdown__icon" />
								Art
							</li>
							<li class="dropdown__item" data-id="ceramics">
								<img src="./src/img/board-icons/ceramics-icon.jpg" class="dropdown__icon" />
								Ceramics
							</li>
						</ul>
					</div>
				</div>
			</div>
		</header>

		<section class="about">
			<div class="container about__container">
				<div class="about__content">
					<h1 class="about__title">Curated Minimalism</h1>
					<p class="about__descr">A personal collection of space, light, and architectural whispers. Each piece selected for its ethereal quality and rhythmic balance.</p>

					<div class="about__info">
						<div class="about__avatars">
							<img class="about__avatar" src="./src/img/avatars/1.jpeg" alt="user" />
							<img class="about__avatar" src="./src/img/avatars/2.jpeg" alt="user" />
							<img class="about__avatar" src="./src/img/avatars/3.jpeg" alt="user" />
						</div>

						<div class="about__stats-wrapper">
							<span class="about__stats">128 Pins</span>
							<span class="about__stats">•</span>
							<span class="about__stats">14.2k Followers</span>
						</div>
					</div>
				</div>
			</div>
		</section>

		<section class="pins">
			<div class="container pins__container"></div>
		</section>

		<div class="modal" id="board-modal">
			<div class="modal__overlay"></div>
			<div class="modal__content">
				<button class="modal__close">&times;</button>
				<h2 class="modal__title">Choose Destination</h2>
				<p class="modal__subtitle">Select an archive to save this piece</p>

				<div class="modal__search-wrapper">
					<span class="modal__search-icon">
						<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path
								d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
								fill="#5D605F" />
						</svg>
					</span>

					<input type="text" class="modal__search-input" placeholder="Search your boards" />
				</div>

				<ul class="modal__list list-reset" id="modal-boards-list"></ul>
			</div>
		</div>

		<script src="./src/js/index.js" type="module"></script>
	</body>
</html>
